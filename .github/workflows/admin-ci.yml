name: Admin CI

on:
  pull_request:
    paths:
      - 'admin-website/**'
      - '.github/workflows/admin-ci.yml'
  push:
    branches: [main]
    paths:
      - 'admin-website/**'
      - '.github/workflows/admin-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-website
    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json `packageManager` field.
      # action-setup v4 refuses to run when it is told twice, so this must not
      # also carry a `version` input.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # From the workspace root: inside admin-website/ it would resolve to the
      # root anyway and install all five projects, both Expo apps included.
      - name: Install admin-website dependencies
        run: pnpm install --frozen-lockfile --filter admin-website...
        working-directory: .

      - run: pnpm typecheck
      # oxlint exits non-zero only on errors; warnings are reported, not fatal.
      - run: pnpm lint
      - run: pnpm build
